name: Release packaging-mockup

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: packaging-mockup-release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Package skill
        run: python3 tools/package_skill.py --output release
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Increment VERSION to publish a new version."
            exit 0
          fi
          gh release create "$tag" "release/packaging-mockup-${tag}.zip" release/SHA256SUMS \
            --target "$GITHUB_SHA" --title "包装效果图 $tag" --generate-notes
