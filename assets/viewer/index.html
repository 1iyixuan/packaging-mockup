<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:">
  <meta name="description" content="$description">
  <title>$page_title</title>
  <link rel="stylesheet" href="./viewer.css">
  <script defer src="./viewer.js"></script>
</head>
<body>
  <header><h1>$heading</h1></header>
  <main aria-label="包装三维展示">
    <model-viewer
      src="./model.glb" $poster_attr
      alt="$description，拖动旋转，滚轮或双指缩放，Home 返回初始角度"
      camera-controls disable-pan disable-tap touch-action="none"
      interaction-prompt="none" loading="eager" reveal="auto"
      camera-orbit="$orbit" data-initial-orbit="$orbit"
      min-camera-orbit="auto 0.1deg 40%"
      max-camera-orbit="auto 179.9deg 300%"
      field-of-view="30deg" environment-image="neutral"
      tone-mapping="neutral" exposure="1"
      shadow-intensity="0.8" shadow-softness="1"
      tabindex="0">
    </model-viewer>
  </main>
  <p id="load-status" role="status" aria-live="polite">正在加载包装模型…</p>
  <noscript><p class="no-script">请启用 JavaScript 查看可旋转的包装模型。</p></noscript>
</body>
</html>
